<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - CestaJusta</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container header-content">
      <img src="https://via.placeholder.com/80x80?text=$" alt="CestaJusta" class="logo" />
      <div>
        <h1>Crear perfil</h1>
        <p>Regístrate para guardar tu información</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Datos de usuario</h2>

      <form id="register-form">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" required />
        </div>

        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" name="apellidos" type="text" required />
        </div>

        <div class="form-group">
          <label for="nombreUsuario">Nombre de usuario</label>
          <input id="nombreUsuario" name="nombreUsuario" type="text" required />
        </div>

        <div class="form-group">
          <label for="gmail">Correo (Gmail)</label>
          <input id="gmail" name="gmail" type="email" placeholder="usuario@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" placeholder="600000000" />
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" minlength="6" required />
        </div>

        <button type="submit" class="btn-primary">Crear cuenta</button>
      </form>

      <p id="register-result" style="margin-top: 1rem;"></p>
      <p style="margin-top: 1rem;"><a href="index.html">Volver a inicio</a></p>
    </section>
  </main>

  <script src="register.js"></script>
</body>
</html>
